name: Update license data from voting minutes
on:
  # The scraper (scrape_license_board.yml) commits each new voting-minutes PDF
  # to main. Process new PDFs as soon as they land.
  push:
    branches: ["main"]
    paths:
      - "scraper/scrape/data/voting_minutes_pdfs/*.pdf"
      # Re-apply manual corrections as soon as they are merged
      - "scripts/data/license_corrections.json"

  # Weekly fallback, after the Monday 00:00 scrape. Even with no new PDF, this
  # applies license_corrections.json and expires stale applications.
  schedule:
    - cron: "0 6 * * 1"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
    inputs:
      target-repository:
        required: false
        type: string
        default: "codeforboston/boston-liquor-license-tracker"
      target-ref:
        required: false
        type: string
        default: "main"

# Lets GITHUB_TOKEN push the update branch and open its pull request
permissions:
  contents: write
  pull-requests: write

# Never run two pipeline instances at once; they would race on the same PR branch.
concurrency:
  group: liquor-license-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TRANSFORM_DIR: ./scraper/transform
      PDF_DIR: scraper/scrape/data/voting_minutes_pdfs
    steps:
      # LFS files are not fetched here; only the new PDFs are pulled below.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target-repository }}
          ref: ${{ inputs.target-ref }}

      # Every committed PDF dated after last_processed_date.json, oldest first,
      # using the newest version (_v2, _v3) of each meeting.
      - name: Find unprocessed voting minutes
        id: find
        run: |
          python3 scripts/find_new_minutes.py \
            --pdf-dir "$PDF_DIR" \
            --last-processed client/src/data/last_processed_date.json \
            --list-file /tmp/new_minutes.txt | tee -a "$GITHUB_OUTPUT"
          cat /tmp/new_minutes.txt

      - name: Download those PDFs from Git LFS
        if: steps.find.outputs.count != '0'
        run: git lfs pull --include "$(paste -sd, /tmp/new_minutes.txt)"

      - name: Install uv
        if: steps.find.outputs.count != '0'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync transform pipeline dependencies
        if: steps.find.outputs.count != '0'
        working-directory: ${{ env.TRANSFORM_DIR }}
        run: uv sync --frozen

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install Node dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Install Python script dependencies
        working-directory: ./scripts
        run: pip install python-dateutil python-dotenv

      - name: Run transform pipeline
        if: steps.find.outputs.count != '0'
        working-directory: ${{ env.TRANSFORM_DIR }}
        run: |
          mkdir -p /tmp/transform
          mapfile -t pdfs < /tmp/new_minutes.txt
          outputs=()
          for pdf in "${pdfs[@]}"; do
            out="/tmp/transform/$(basename "$pdf" .pdf).json"
            echo "Processing PDF: $pdf"
            uv run python -m app.cli --file "$GITHUB_WORKSPACE/$pdf" --output "$out"
            outputs+=("$out")
          done
          # One merge input, oldest meeting first
          jq -s 'add' "${outputs[@]}" > /tmp/transform_output.json

      - name: Merge transform output into licenses.json
        id: merge
        working-directory: ./scripts
        run: |
          if [ "${{ steps.find.outputs.count }}" != "0" ]; then
            python3 merge_licenses.py --input /tmp/transform_output.json --report /tmp/pr_body.md
          else
            python3 merge_licenses.py --report /tmp/pr_body.md
          fi
          if grep -q "^## Needs review" /tmp/pr_body.md; then
            echo "needs-review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-review=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/pr_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compile update processed date
        if: steps.find.outputs.count != '0'
        working-directory: ./scripts
        run: npm run build:update-last-processed

      - name: Run update processed date
        if: steps.find.outputs.count != '0'
        working-directory: ./scripts
        run: npm run run:update-last-processed -- ${{ steps.find.outputs.latest-date }}

      - name: Compile validate license data
        working-directory: ./scripts
        run: npm run build:validate-license

      - name: Validate license data
        working-directory: ./scripts
        run: npm run run:validate-license

      # Token from the license-tracker GitHub App (#553). Skipped until the App
      # is configured; the steps below then fall back to GITHUB_TOKEN.
      - name: Get bot token
        id: bot-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: "[SCRIPT] Update liquor license applicant data"
          body-path: /tmp/pr_body.md
          labels: ${{ steps.merge.outputs.needs-review == 'true' && 'needs-review' || '' }}
          branch: update-liquor-license-data
          delete-branch: true
          commit-message: "[SCRIPT] Update liquor license applicant data"
          committer: Github Actions <hello@codeforboston.org>
          author: Github Actions <hello@codeforboston.org>
          add-paths: |
            client/src/data/last_processed_date.json
            client/src/data/licenses.json

      # Only merge clean runs; anything flagged for review waits for a person.
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != '' && steps.merge.outputs.needs-review != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          AS_BOT: ${{ steps.bot-token.outputs.token != '' }}
        run: |
          if [ "$AS_BOT" = "true" ]; then
            # The App is on the ProtectMain bypass list for pull requests, so it
            # merges right away. Retry while GitHub computes mergeability.
            for attempt in 1 2 3 4 5; do
              gh pr merge --squash --admin "$PR" && exit 0
              sleep 10
            done
            exit 1
          fi
          # Without the App, queue auto-merge; a maintainer still has to approve.
          gh pr merge --auto --squash "$PR"
