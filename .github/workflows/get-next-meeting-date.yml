name: Get Next Meeting Date
on:
  schedule:
    - cron: "0 0 * * 0" # Runs at midnight every Sunday

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow committing changes, so we can update the next meeting date
permissions:
  contents: write
  pull-requests: write

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: "codeforboston/boston-liquor-license-tracker"
          ref: "main"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: scripts/getNextMeetingDate/package-lock.json

      - name: Install script dependencies
        working-directory: ./scripts/getNextMeetingDate
        run: npm install

      - name: Compile and run next meeting date script
        working-directory: ./scripts/getNextMeetingDate
        run: |
          npm run build:next-meeting-date
          npm run run:next-meeting-date

      # Token from the license-tracker GitHub App (#553). Skipped until the App
      # is configured; the steps below then fall back to GITHUB_TOKEN.
      - name: Get bot token
        id: bot-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create pull request to merge in new next meeting date
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: "[SCRIPT] Update next meeting date"
          body: |
            Update next meeting date
            - This PR updates the next meeting date based on the latest data scraped from the Boston liquor licensing board website.\
            - Auto generated by the Next Meeting Date Github Action.
          branch: update-next-meeting-date
          delete-branch: true
          commit-message: "[SCRIPT] Update next meeting date"
          committer: Github Actions <hello@codeforboston.org>
          author: Github Actions <hello@codeforboston.org>
          add-paths: client/src/data/*.json

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          AS_BOT: ${{ steps.bot-token.outputs.token != '' }}
        run: |
          if [ "$AS_BOT" = "true" ]; then
            # The App is on the ProtectMain bypass list for pull requests, so it
            # merges right away. Retry while GitHub computes mergeability.
            for attempt in 1 2 3 4 5; do
              gh pr merge --squash --admin "$PR" && exit 0
              sleep 10
            done
            exit 1
          fi
          # Without the App, queue auto-merge; a maintainer still has to approve.
          gh pr merge --auto --squash "$PR"
