name: Test data pipeline

on:
  pull_request:
    paths:
      - "scripts/**"
      - "scraper/scrape/app/**"
      - "scraper/scrape/tests/**"
      - "scraper/scrape/pyproject.toml"
      - "scraper/scrape/uv.lock"
      - "scraper/transform/**"
      - "client/src/data/licenses.json"
      - "client/src/data/schema/license-schema.json"
      - ".github/workflows/test-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transform-tests:
    name: Transform pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper/transform
    steps:
      - uses: actions/checkout@v7
      # The golden-output tests need the minutes PDFs they reference (Git LFS).
      # Download only those, derived from the reference files in tests/golden/.
      - name: Fetch PDFs used by golden-output tests
        working-directory: .
        run: |
          include=$(ls scraper/transform/tests/golden/*.json \
            | xargs -n1 basename | sed 's/\.json$/.pdf/' \
            | sed 's#^#scraper/scrape/data/voting_minutes_pdfs/#' | paste -sd, -)
          git lfs install --local
          git lfs pull --include="$include"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: uv run --frozen --extra dev pytest -q

  scraper-tests:
    name: Scraper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper/scrape
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: uv run --frozen --with pytest pytest -q

  merge-tests:
    name: Merge script tests and license data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run merge script tests
        working-directory: scripts
        run: |
          pip install python-dateutil python-dotenv pytest
          python -m pytest -q __tests__/unit/test_merge_licenses.py __tests__/unit/test_find_new_minutes.py __tests__/unit/test_apply_correction.py
      - name: Corrections file is already applied to licenses.json
        working-directory: scripts
        run: |
          cp ../client/src/data/licenses.json /tmp/before.json
          python merge_licenses.py --no-expire
          if ! diff -q /tmp/before.json ../client/src/data/licenses.json; then
            echo "::error::licenses.json is out of date with license_corrections.json. Run 'python3 merge_licenses.py' in scripts/ and commit the result."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Lint scripts and validate license data (schema + invariants)
        working-directory: scripts
        run: |
          npm ci
          npm run lint
          npm run build:validate-license
          npm run run:validate-license
