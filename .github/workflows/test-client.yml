name: Test Client

# "build" is a required check on main, so it must report on every PR. A
# workflow-level `paths` filter would skip it entirely on PRs that only touch
# workflows, the scraper or docs, leaving them unmergeable without a bypass.
# Instead the job always runs and skips the real work when nothing relevant
# changed.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The PR's merge commit plus its first parent (the current base).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for client changes
        id: changes
        run: |
          git diff --name-only HEAD^1 HEAD | tee /tmp/changed.txt
          if grep -qE '^(client/|scripts/|package(-lock)?\.json$)' /tmp/changed.txt; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
            echo "No client, scripts or package changes; skipping tests and build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.client == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.client == 'true'
        run: npm ci
        working-directory: ./client

      - name: Run tests
        if: steps.changes.outputs.client == 'true'
        run: npm test
        working-directory: ./client

      - name: Verify build
        if: steps.changes.outputs.client == 'true'
        run: npm run build
        working-directory: ./client
