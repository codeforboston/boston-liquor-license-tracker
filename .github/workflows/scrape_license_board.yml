name: Run Licensing Board Scraper

on:
  schedule:
    - cron: "0 0 * * 1" # Runs at midnight every Monday
    
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SCRAPER_DIR: ./scraper/scrape   # App Directory
      PDFS_DIR: ./data/voting_minutes_pdfs  # PDF Output Directory

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Materialize LFS objects
        run: git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies (from uv.lock)
        working-directory: ${{ env.SCRAPER_DIR }}
        run: uv sync --frozen

      - name: Run Scraper
        working-directory: ${{ env.SCRAPER_DIR }}
        run: uv run python -m app.main --download_dir ${{ env.PDFS_DIR }}

      # Token from the license-tracker GitHub App (#553). Skipped until the App
      # is configured; the steps below then fall back to GITHUB_TOKEN.
      - name: Get bot token
        id: bot-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create pull request to merge in new scraped data and PDFs
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          title: "[SCRAPER] Update scraped data and PDFs"
          body: |
            Update scraped data and PDFs
            - This PR updates voting-minute data and PDFs based on the latest data scraped from the Boston liquor licensing board website.
            - Auto generated by the Licensing Board Scraper Github Action.
          branch: update-scraped-data-and-pdfs
          delete-branch: true
          commit-message: "[SCRAPER] Update scraped data and PDFs"
          committer: Github Actions <hello@codeforboston.org>
          author: Github Actions <hello@codeforboston.org>
          add-paths: |
            ${{ env.SCRAPER_DIR }}/${{ env.PDFS_DIR }}/*.pdf
            ${{ env.SCRAPER_DIR }}/data/url_exclude_list.json
            ${{ env.SCRAPER_DIR }}/data/link_stats_log.csv
            ${{ env.SCRAPER_DIR }}/data/hearing_video_links.json
            ${{ env.SCRAPER_DIR }}/data/voting_minutes_links.json
            ${{ env.SCRAPER_DIR }}/log/app.log

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          AS_BOT: ${{ steps.bot-token.outputs.token != '' }}
        run: |
          if [ "$AS_BOT" = "true" ]; then
            # The App is on the ProtectMain bypass list for pull requests, so it
            # merges right away. Retry while GitHub computes mergeability.
            for attempt in 1 2 3 4 5; do
              gh pr merge --squash --admin "$PR" && exit 0
              sleep 10
            done
            exit 1
          fi
          # Without the App, queue auto-merge; a maintainer still has to approve.
          gh pr merge --auto --squash "$PR"

