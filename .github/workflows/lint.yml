name: Lint comments

# pull_request (not pull_request_target): the PR's own code is checked out and
# its npm packages installed, so it must not run with the base repo's secrets.
# PRs from forks get a read-only token; reviewdog then reports findings as
# annotations instead of review comments.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['client/**', '.github/workflows/lint.yml']

jobs:
  eslint:
    name: Lint with ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
        working-directory: ./client
      - uses: reviewdog/action-eslint@v1
        with:
          workdir: ./client
          eslint_flags: '.'
          reporter: github-pr-review
          # See the following for filter options:
          # https://github.com/reviewdog/reviewdog?tab=readme-ov-file#filter-mode
          filter_mode: 'added'

  stylelint:
    name: Lint with Stylelint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
        working-directory: ./client
      - uses: reviewdog/action-stylelint@v1
        with:
          workdir: ./client
          stylelint_input: '**/*.css'
          reporter: github-pr-review
          filter_mode: 'added'